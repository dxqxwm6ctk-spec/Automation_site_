openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workflows
    description: Workflow CRUD and versioning
  - name: executions
    description: Workflow execution and run history
  - name: webhooks
    description: Webhook management and inbound trigger
  - name: credentials
    description: Encrypted credential storage for use by nodes (e.g. HTTP Request auth)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: >-
        Reports whether downstream dependencies are reachable. Postgres is
        checked live; Redis is reported as "not_configured" until Phase 0.4
        provisions it. Returns 200 when ready, 503 when degraded.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Degraded — one or more dependencies are unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /v1/workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List workflows
      description: Returns a page of workflows, most recently created first.
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match on workflow name.
          schema: { type: string }
        - name: isActive
          in: query
          description: Filter by active status.
          schema: { type: boolean }
        - name: tags
          in: query
          description: Only return workflows that have ALL of the given tags.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: after
          in: query
          description: Opaque pagination cursor from a previous response's nextCursor.
          schema: { type: string }
        - name: limit
          in: query
          description: Max results per page (1-100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of workflows
          content:
            application/json:
              schema:
                type: object
                required: [workflows, nextCursor, total]
                properties:
                  workflows:
                    type: array
                    items: { $ref: "#/components/schemas/Workflow" }
                  nextCursor:
                    type: ["string", "null"]
                  total:
                    type: integer
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow
      description: Creates a workflow and its initial version (version 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [workflow, version]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
                  version: { $ref: "#/components/schemas/WorkflowVersion" }
        "422":
          description: Validation error
  /v1/workflows/{workflowId}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get a workflow
      description: Returns a workflow along with its currently active version.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      responses:
        "200":
          description: Workflow detail
          content:
            application/json:
              schema:
                type: object
                required: [workflow, activeVersion]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
                  activeVersion:
                    oneOf:
                      - $ref: "#/components/schemas/WorkflowVersion"
                      - type: "null"
        "404":
          description: Workflow not found
    put:
      operationId: saveWorkflowVersion
      tags: [workflows]
      summary: Save a new workflow version
      description: >-
        Creates a new version from the given graph and makes it the active
        version. Existing versions are never modified — every save is a new,
        incrementing version number.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowVersionInput" }
      responses:
        "200":
          description: The new version, now active
          content:
            application/json:
              schema:
                type: object
                required: [workflow, version]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
                  version: { $ref: "#/components/schemas/WorkflowVersionSummary" }
        "404":
          description: Workflow not found
        "422":
          description: Validation error
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update workflow metadata
      description: Updates name, description, tags, and/or isActive. Does not create a new version.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowUpdate" }
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "404":
          description: Workflow not found
        "422":
          description: Validation error
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete a workflow
      description: Soft-deletes the workflow. It no longer appears in list/get responses.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Workflow not found
  /v1/workflows/{workflowId}/versions:
    get:
      operationId: listWorkflowVersions
      tags: [workflows]
      summary: List workflow versions
      description: Returns every saved version for a workflow, most recent first.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkflowVersionSummary" }
        "404":
          description: Workflow not found
  /v1/workflows/{workflowId}/versions/{versionId}/restore:
    post:
      operationId: restoreWorkflowVersion
      tags: [workflows]
      summary: Restore a previous version
      description: >-
        Points the workflow's active version back at an existing version.
        Does not create a new version.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
        - $ref: "#/components/parameters/VersionIdParam"
      responses:
        "200":
          description: Workflow with the restored active version
          content:
            application/json:
              schema:
                type: object
                required: [workflow]
                properties:
                  workflow: { $ref: "#/components/schemas/Workflow" }
        "404":
          description: Workflow or version not found
  /v1/workflows/{workflowId}/execute:
    post:
      operationId: executeWorkflow
      tags: [workflows]
      summary: Execute a workflow
      description: >-
        Runs the workflow's active version. Starts the run asynchronously
        and returns immediately with a "pending" execution — poll
        GET /v1/executions/{executionId} for progress and the final result.
      parameters:
        - $ref: "#/components/parameters/WorkflowIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                triggerPayload:
                  description: Arbitrary JSON passed as the input to the workflow's entry node.
      responses:
        "202":
          description: Execution accepted and started
          content:
            application/json:
              schema:
                type: object
                required: [execution]
                properties:
                  execution: { $ref: "#/components/schemas/Execution" }
        "404":
          description: Workflow not found
        "422":
          description: >-
            The workflow has no version to run, or its graph cannot be
            executed (no entry node, more than one entry node, a cycle, or a
            dangling connection reference).
  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [webhooks]
      summary: List webhooks
      description: Returns all webhooks, optionally filtered by workflow.
      parameters:
        - name: workflowId
          in: query
          description: Only return webhooks for this workflow.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A list of webhooks
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
    post:
      operationId: createWebhook
      tags: [webhooks]
      summary: Create a webhook
      description: >-
        Registers a new webhook for a workflow. The returned token is used in
        the public trigger URL: POST /api/webhooks/{token}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created webhook
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
        "404":
          description: Workflow not found
  /v1/webhooks/{webhookId}:
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook
      parameters:
        - $ref: "#/components/parameters/WebhookIdParam"
      responses:
        "200":
          description: Webhook detail
          content:
            application/json:
              schema:
                type: object
                required: [webhook]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
        "404":
          description: Webhook not found
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook
      parameters:
        - $ref: "#/components/parameters/WebhookIdParam"
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Webhook not found
  /v1/credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List credentials
      description: >-
        Returns all saved credentials. Never includes the encrypted secret
        data — only metadata needed to pick a credential in the UI.
      responses:
        "200":
          description: A list of credentials
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Create a credential
      description: >-
        Encrypts the provided secret data at rest (AES-256-GCM). The
        plaintext `data` is never stored or returned — only `name` and
        `credentialType` are echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialInput" }
      responses:
        "201":
          description: Created credential
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential: { $ref: "#/components/schemas/Credential" }
        "409":
          description: A credential with this name already exists
  /v1/credentials/{credentialId}:
    get:
      operationId: getCredential
      tags: [credentials]
      summary: Get a credential
      description: Returns credential metadata only — never the secret data.
      parameters:
        - $ref: "#/components/parameters/CredentialIdParam"
      responses:
        "200":
          description: Credential detail
          content:
            application/json:
              schema:
                type: object
                required: [credential]
                properties:
                  credential: { $ref: "#/components/schemas/Credential" }
        "404":
          description: Credential not found
    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential
      description: Soft-deletes the credential; it can no longer be selected by nodes.
      parameters:
        - $ref: "#/components/parameters/CredentialIdParam"
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Credential not found
  /v1/executions:
    get:
      operationId: listExecutions
      tags: [executions]
      summary: List executions
      description: Returns a page of executions, most recently created first.
      parameters:
        - name: workflowId
          in: query
          description: Only return executions for this workflow.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Filter by execution status.
          schema: { $ref: "#/components/schemas/ExecutionStatus" }
        - name: after
          in: query
          description: Opaque pagination cursor from a previous response's nextCursor.
          schema: { type: string }
        - name: limit
          in: query
          description: Max results per page (1-100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of executions
          content:
            application/json:
              schema:
                type: object
                required: [executions, nextCursor, total]
                properties:
                  executions:
                    type: array
                    items: { $ref: "#/components/schemas/Execution" }
                  nextCursor:
                    type: ["string", "null"]
                  total:
                    type: integer
  /v1/executions/{executionId}:
    get:
      operationId: getExecution
      tags: [executions]
      summary: Get an execution
      description: >-
        Returns an execution together with every node-level log recorded for
        it, ordered by start time.
      parameters:
        - $ref: "#/components/parameters/ExecutionIdParam"
      responses:
        "200":
          description: Execution detail
          content:
            application/json:
              schema:
                type: object
                required: [execution, logs]
                properties:
                  execution: { $ref: "#/components/schemas/Execution" }
                  logs:
                    type: array
                    items: { $ref: "#/components/schemas/ExecutionLog" }
        "404":
          description: Execution not found
  /v1/executions/{executionId}/cancel:
    post:
      operationId: cancelExecution
      tags: [executions]
      summary: Cancel an execution
      description: >-
        Requests cancellation of a pending or running execution. Any node
        currently in flight is aborted as soon as possible; the execution's
        final status becomes "cancelled".
      parameters:
        - $ref: "#/components/parameters/ExecutionIdParam"
      responses:
        "200":
          description: The now-cancelled execution
          content:
            application/json:
              schema:
                type: object
                required: [execution]
                properties:
                  execution: { $ref: "#/components/schemas/Execution" }
        "404":
          description: Execution not found
        "409":
          description: Execution already finished and cannot be cancelled
components:
  parameters:
    WebhookIdParam:
      name: webhookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkflowIdParam:
      name: workflowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionIdParam:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExecutionIdParam:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialIdParam:
      name: credentialId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    WebhookResponseMode:
      type: string
      enum: [immediate, wait_for_completion]
    WebhookInput:
      type: object
      required: [workflowId]
      properties:
        workflowId: { type: string, format: uuid }
        method: { type: string, default: POST }
        responseMode: { $ref: "#/components/schemas/WebhookResponseMode" }
    Webhook:
      type: object
      description: A registered webhook that triggers a workflow via HTTP.
      required: [id, workflowId, token, method, responseMode, responseStatus, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        token:
          type: string
          description: >-
            Public token used in the trigger URL:
            POST /api/webhooks/{token}
        method: { type: string }
        responseMode: { $ref: "#/components/schemas/WebhookResponseMode" }
        responseStatus: { type: integer }
        isActive: { type: boolean }
        lastTriggeredAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CredentialInput:
      type: object
      required: [name, credentialType, data]
      properties:
        name: { type: string, minLength: 1 }
        credentialType:
          type: string
          description: 'Free-form label for the shape of `data`, e.g. "basic", "bearer", "api_key".'
          minLength: 1
        data:
          type: object
          description: >-
            Plaintext secret fields (e.g. {"username","password"} or
            {"token"}). Encrypted at rest; never stored in plaintext or
            returned by any endpoint.
          additionalProperties: { type: string }
    Credential:
      type: object
      description: >-
        Metadata for a saved credential. The encrypted secret data itself is
        never exposed via the API.
      required: [id, name, credentialType, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        credentialType: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          properties:
            postgres:
              type: string
            redis:
              type: string
          required:
            - postgres
            - redis
      required:
        - status
        - checks
    Workflow:
      type: object
      description: A workflow and its metadata (not its graph — see WorkflowVersion).
      required:
        - id
        - name
        - description
        - tags
        - isActive
        - activeVersionId
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        isActive: { type: boolean }
        activeVersionId: { type: ["string", "null"], format: uuid }
        lastExecutionAt:
          type: ["string", "null"]
          format: date-time
          description: When this workflow's most recent execution was created. Null if it has never run.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
          default: []
        graph:
          $ref: "#/components/schemas/WorkflowGraph"
    WorkflowUpdate:
      type: object
      description: At least one field must be provided.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: ["string", "null"] }
        tags:
          type: array
          items: { type: string }
        isActive: { type: boolean }
    WorkflowVersionInput:
      type: object
      required: [graph]
      properties:
        graph: { $ref: "#/components/schemas/WorkflowGraph" }
        description: { type: string }
    WorkflowVersion:
      type: object
      description: A full, immutable snapshot of a workflow's graph.
      required: [id, workflowId, version, graphJson, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        version: { type: integer }
        graphJson: { $ref: "#/components/schemas/WorkflowGraph" }
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    WorkflowVersionSummary:
      type: object
      description: Version metadata without the (potentially large) graph payload.
      required: [id, version, description, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    WorkflowGraph:
      type: object
      required: [nodes, connections]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/WorkflowGraphNode" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/WorkflowGraphConnection" }
    WorkflowGraphNode:
      type: object
      description: A single node placed on the canvas.
      required: [key, type]
      properties:
        key:
          type: string
          description: Stable node identifier, unique within the graph.
        type:
          type: string
          enum: [start, webhook_trigger, telegram_trigger, schedule_trigger, http_request, telegram_action, openai_image, code, delay, if, switch, loop, set_variable, log, end]
        label:
          type: ["string", "null"]
        position:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }
        config:
          type: object
          additionalProperties: true
          description: Node-type-specific settings (shape depends on type).
    WorkflowGraphConnection:
      type: object
      description: A directed edge between two nodes.
      required: [sourceKey, targetKey]
      properties:
        sourceKey: { type: string }
        sourceHandle: { type: ["string", "null"] }
        targetKey: { type: string }
        targetHandle: { type: ["string", "null"] }
    ExecutionStatus:
      type: string
      enum: [pending, running, success, error, cancelled, timeout]
    Execution:
      type: object
      description: A single run of a workflow.
      required:
        - id
        - workflowId
        - versionId
        - status
        - triggerType
        - triggerPayload
        - output
        - error
        - startedAt
        - finishedAt
        - durationMs
        - retryCount
        - parentId
        - createdAt
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ExecutionStatus" }
        triggerType:
          type: string
          enum: [manual, webhook, schedule, api]
        triggerPayload:
          description: The input the entry node ran with. Arbitrary JSON, or null.
        output:
          description: The workflow's final output (its terminal node's output, or one merged object keyed by node if it has several). Null until the execution finishes.
        error:
          description: Structured error detail if the execution didn't succeed. Null otherwise.
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        durationMs: { type: ["integer", "null"] }
        retryCount: { type: integer }
        parentId:
          type: ["string", "null"]
          format: uuid
          description: Reserved for sub-workflow calls. Always null for now.
        createdAt: { type: string, format: date-time }
    ExecutionLog:
      type: object
      description: A single node's run within an execution.
      required:
        - id
        - executionId
        - nodeKey
        - status
        - input
        - output
        - error
        - storageRef
        - durationMs
        - attempt
        - startedAt
        - finishedAt
        - createdAt
      properties:
        id: { type: string, format: uuid }
        executionId: { type: string, format: uuid }
        nodeKey:
          type: string
          description: The graph node's `key` this log entry belongs to.
        status:
          type: string
          enum: [pending, running, success, error, skipped]
        input:
          description: The value passed into this node. Arbitrary JSON, or null.
        output:
          description: The value this node produced. Null unless status is "success".
        error:
          description: Structured error detail if this node failed. Null otherwise.
        storageRef:
          type: ["string", "null"]
          description: Reserved for offloading large (>100 KB) payloads to object storage. Always null for now.
        durationMs: { type: ["integer", "null"] }
        attempt:
          type: integer
          description: Always 1 — retries are not implemented yet.
        startedAt: { type: ["string", "null"], format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
